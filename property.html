<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Details | RentEasy Kenya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🏠 RentEasy Kenya
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#properties">Properties</a></li>
        <li><a href="list-property.html">List Property</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

</nav>


<section class="property-details">

    <div id="propertyContainer">

        <p>Loading property...</p>

    </div>

</section>


<footer>

    <p>&copy; 2026 RentEasy Kenya. All Rights Reserved.</p>

</footer>


<script>

const container =
    document.getElementById("propertyContainer");

const propertyData =
    localStorage.getItem("selectedProperty");


if (!propertyData) {

    container.innerHTML = `

        <h2>Property not found</h2>

        <p>
            Please go back to the properties page
            and select a property again.
        </p>

        <a href="index.html" class="btn">
            Back to Properties
        </a>

    `;

} else {

    try {

        const property =
            JSON.parse(propertyData);


        const title =
            property.title || "Rental Property";

        const location =
            property.location || "Location not available";

        const rooms =
            property.rooms || "N/A";

        const price =
            property.price || "Price not available";

        const description =
            property.description || "No description available.";

        const image =
            property.image ||
            "https://picsum.photos/800/500";


        container.innerHTML = `

            <div class="property-card">

                <img
                    src="${image}"
                    alt="${title}"
                    class="property-image"
                >


                <div class="property-content">

                    <h1>
                        ${title}
                    </h1>


                    <p class="location">
                        📍 ${location}
                    </p>


                    <p class="rooms">
                        🛏️ ${rooms} Bedrooms
                    </p>


                    <p class="price">
                        KSh ${price}/month
                    </p>


                    <h3>
                        Property Description
                    </h3>


                    <p>
                        ${description}
                    </p>


                    <h3>
                        Location
                    </h3>


                    <iframe
                        src="https://www.google.com/maps?q=${encodeURIComponent(location)}&output=embed"
                        width="100%"
                        height="300"
                        style="border:0;"
                        loading="lazy">
                    </iframe>


                    <div class="property-buttons">

                        <button
                            class="whatsapp-btn"
                            id="whatsappButton">

                            Contact on WhatsApp

                        </button>


                        <button
                            class="details-btn"
                            id="directionsButton">

                            📍 Get Directions

                        </button>


                        <a
                            href="index.html"
                            class="btn">

                            ← Back to Properties

                        </a>

                    </div>

                </div>

            </div>

        `;


        document
            .getElementById("whatsappButton")
            .addEventListener("click", function () {

                const message =
                    `Hello, I am interested in ${title} in ${location}.`;

                const whatsappURL =
                    "https://wa.me/254799520544?text=" +
                    encodeURIComponent(message);

                window.open(
                    whatsappURL,
                    "_blank"
                );

            });


        document
            .getElementById("directionsButton")
            .addEventListener("click", function () {

                const mapsURL =
                    "https://www.google.com/maps/search/?api=1&query=" +
                    encodeURIComponent(location);

                window.open(
                    mapsURL,
                    "_blank"
                );

            });


    } catch (error) {

        console.error(
            "Error loading property:",
            error
        );


        container.innerHTML = `

            <h2>
                Unable to load property
            </h2>


            <p>
                There was a problem loading this property.
            </p>


            <a
                href="index.html"
                class="btn">

                Back to Properties

            </a>

        `;

    }

}

</script>

</body>
</html>
