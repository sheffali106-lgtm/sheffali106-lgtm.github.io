<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details | RentEasy Kenya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">🏠 RentEasy Kenya</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#properties">Properties</a></li>
        <li><a href="list-property.html">List Property</a></li>
    </ul>
</nav>

<section class="property-details">
    <div id="propertyContainer"><p style="text-align:center;">Loading property...</p></div>
</section>

<footer><p>&copy; 2026 RentEasy Kenya. All Rights Reserved.</p></footer>

<script type="module">
import { db } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const container = document.getElementById("propertyContainer");

async function loadProperty() {
  const params = new URLSearchParams(window.location.search);
  const idFromUrl = params.get('id');
  
  let property = null;
  let propertyId = idFromUrl;

  // Try localStorage as backup
  const localData = localStorage.getItem("selectedProperty");
  if (localData) {
    try {
      const parsed = JSON.parse(localData);
      if (!propertyId && parsed.id) propertyId = parsed.id;
      if (!propertyId) property = parsed;
    } catch(e) {}
  }

  // Fetch fresh from Firebase if we have ID
  if (propertyId) {
    try {
      const snap = await getDoc(doc(db, "properties", propertyId));
      if (snap.exists()) {
        property = { id: snap.id, ...snap.data() };
      }
    } catch(err) {
      console.error(err);
    }
  }

  if (!property) {
    container.innerHTML = `<div style="text-align:center; padding:20px;"><h2>Property not found</h2><p>Please go back to homepage and click View Details again.</p><a href="index.html">← Back</a></div>`;
    return;
  }

  // Handles both 'rooms' and 'bedrooms' etc.
  const title = property.title || "Rental Property";
  const location = property.location || property.area || "Location unavailable";
  const rooms = property.rooms || property.bedrooms || "N/A";
  const price = property.price || "Price not available";
  const description = property.description || "No description available.";
  const image = property.image || "https://picsum.photos/800/500";

  container.innerHTML = `
    <div class="property-card">
      <img src="${image}" alt="${title}" class="property-image" style="width:100%; max-height:400px; object-fit:cover;" onerror="this.src='https://picsum.photos/800/500'">
      <div class="property-content" style="padding:15px;">
        <h1>${title}</h1>
        <p>📍 ${location}</p>
        <p>🛏️ ${rooms} Bedrooms</p>
        <p style="color:blue; font-weight:bold;">KSh ${price}/month</p>
        <h3>Property Description</h3><p>${description}</p>
        <h3>Location</h3>
        <iframe src="https://www.google.com/maps?q=${encodeURIComponent(location)}&output=embed" width="100%" height="300" style="border:0;" loading="lazy"></iframe>
        <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
          <button id="whatsappButton" style="background:#25D366; color:white; padding:10px 15px; border:none; border-radius:5px;">Contact on WhatsApp</button>
          <button id="directionsButton" style="background:#007bff; color:white; padding:10px 15px; border:none; border-radius:5px;">📍 Get Directions</button>
          <a href="index.html" style="background:#198754; color:white; padding:10px 15px; border-radius:5px; text-decoration:none;">← Back to Properties</a>
        </div>
      </div>
    </div>
  `;

  document.getElementById("whatsappButton").onclick = () => {
    window.open(`https://wa.me/254799520544?text=${encodeURIComponent(`Hello, I am interested in ${title} in ${location}.`)}`, "_blank");
  };
  document.getElementById("directionsButton").onclick = () => {
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`, "_blank");
  };
}
loadProperty();
</script>
</body>
</html>
