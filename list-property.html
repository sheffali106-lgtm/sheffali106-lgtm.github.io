<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Property | RentEasy Kenya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">🏠 RentEasy Kenya</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#properties">Properties</a></li>
        <li><a href="list-property.html">List Property</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<section id="propertySection" style="max-width:700px; margin:40px auto; padding:20px; display:none;">

    <h2>List Your Property</h2>

    <p>Fill the form below to add a new rental property.</p>

    <form id="propertyForm" style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">

        <input
            type="text"
            id="title"
            placeholder="Property Title"
            required>

        <input
            type="text"
            id="location"
            placeholder="Location"
            required>

        <input
            type="number"
            id="bedrooms"
            placeholder="Bedrooms"
            min="1"
            required>

        <input
            type="number"
            id="price"
            placeholder="Monthly Rent"
            min="100"
            required>

        <select id="type" required>
            <option value="">Select Property Type</option>
            <option>Apartment</option>
            <option>Maisonette</option>
            <option>Bedsitter</option>
            <option>Studio</option>
            <option>Office</option>
            <option>Shop</option>
        </select>

        <input
            type="tel"
            id="phone"
            placeholder="Contact Phone"
            required>

        <input
            type="text"
            id="amenities"
            placeholder="Amenities">

        <label>
            <input type="checkbox" id="featured">
            ⭐ Feature this property
        </label>

        <textarea
            id="description"
            rows="4"
            placeholder="Property Description"
            required></textarea>

        <input
            type="text"
            id="image"
            placeholder="Image URLs separated by commas">

        <button type="submit" class="btn">
            List Property
        </button>

        <div id="formMessage"></div>

    </form>

</section>

<div id="loadingMessage" style="text-align:center; padding:60px;">
    <h2>Checking your account...</h2>
</div>

<footer>
    <p>&copy; 2026 RentEasy Kenya. All Rights Reserved.</p>
</footer>

<script type="module" src="list-property.js"></script>

</body>
</html>
