<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List Your Property - RentEasy Kenya</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
<h2>🏠 RentEasy Kenya</h2>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="property.html">Properties</a></li>
</ul>
</nav>

<section class="form-container">

<h1>List Your Property</h1>

<form>

<input type="text" placeholder="Property Title" required>

<input type="text" placeholder="Location" required>

<input type="number" placeholder="Monthly Rent (KSh)" required>

<input type="text" placeholder="Bedrooms">
<input type="number" placeholder="Bathrooms">

<select>
    <option>Property Type</option>
    <option>Apartment</option>
    <option>Maisonette</option>
    <option>Bedsitter</option>
    <option>Studio</option>
    <option>Bungalow</option>
</select>

<input type="tel" placeholder="Phone Number">

<input type="email" placeholder="Email Address">

<input type="file" accept="image/*">
<textarea placeholder="Property Description"></textarea>

<button type="submit">Submit Property</button>

</form>

</section>

</body>
</html>
