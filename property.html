<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Details | RentEasy Kenya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🏠 RentEasy Kenya
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#properties">Properties</a></li>
        <li><a href="list-property.html">List Property</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

</nav>


<section class="property-details">

    <div id="propertyContainer">

        <p>Loading property...</p>

    </div>

</section>


<footer>

    <p>&copy; 2026 RentEasy Kenya. All Rights Reserved.</p>

</footer>


<script>

const propertyData =
    localStorage.getItem("selectedProperty");

const container =
    document.getElementById("propertyContainer");


if (!propertyData) {

    container.innerHTML = `
        <h2>Property not found</h2>

        <p>
            Please go back to the properties page
            and select a property again.
        </p>

        <a href="index.html" class="btn">
            Back to Properties
        </a>
    `;

} else {

    try {

        const property =
            JSON.parse(propertyData);

        container.innerHTML = `

            <div class="property-card">

                <img
                    src="${property.image || 'https://picsum.photos/800/500'}"
                    alt="${property.title || 'Rental property'}"
                    class="property-image"
                >

                <div class="property-content">

                    <h1>
                        ${property.title || "Rental Property"}
                    </h1>

                    <p class="location">
                        📍 ${property.location || "Location not available"}
                    </p>

                    <p class="rooms">
                        🛏️ ${property.rooms || "N/A"} Bedrooms
                    </p>

                    <p class="price">
                        KSh ${property.price || "Price not available"}/month
                    </p>

                    <h3>Property Description</h3>

                    <p>
                        ${property.description || "No description available."}
                    </p>


                    <h3>Location</h3>

                    <iframe
                        src="https://www.google.com/maps?q=${encodeURIComponent(property.location || "Nairobi, Kenya")}&output=embed"
                        width="100%"
                        height="300"
                        style="border:0;"
                        loading="lazy">
                    </iframe>


                    <div class="property-buttons">

                        <button
                            class="whatsapp-btn"
                            onclick="contactWhatsApp()">
                            Contact on WhatsApp
                        </button>

                        <button
                            class="details-btn"
                            onclick="getDirections()">
                            📍 Get Directions
                        </button>

                        <a
                            href="index.html"
                            class="btn">
                            ← Back to Properties
                        </a>

                    </div>

                </div>

            </div>

        `;


        window.contactWhatsApp = function () {

            const message =
                `Hello, I am interested in ${property.title || "this property"} in ${property.location || "Kenya"}.`;

            const url =
                "https://wa.me/254799520544?text=" +
                encodeURIComponent(message);

            window.open(url, "_blank");

        };


        window.getDirections = function () {

            const location =
                property.location || "Nairobi, Kenya";

            const url =
                "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(location);

            window.open(url, "_blank");

        };

    } catch (error) {

        console.error(
            "Error loading property:",
            error
        );

        container.innerHTML = `

            <h2>Unable to load property</h2>

            <p>
                There was a problem loading this property.
            </p>

            <a href="index.html" class="btn">
                Back to Properties
            </a>

        `;

    }

}

</script>

</body>
</html>
