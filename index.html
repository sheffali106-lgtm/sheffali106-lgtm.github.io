<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentEasy Kenya</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#fff;color:#111}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:1000}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.logo img{height:52px;width:auto}
.hamburger{display:flex;flex-direction:column;gap:6px;cursor:pointer;padding:8px}
.hamburger span{display:block;width:34px;height:5px;background:#0a6ab5;border-radius:2px}
.side-menu{position:fixed;top:0;right:-100%;width:80%;max-width:320px;height:100%;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,0.15);z-index:2000;transition:0.3s ease;padding:20px}
.side-menu.active{right:0}
.side-menu .close{font-size:32px;cursor:pointer;text-align:right;margin-bottom:20px}
.side-menu a{display:block;padding:14px 0;border-bottom:1px solid #f0f0f0;text-decoration:none;color:#111;font-size:18px;font-weight:500}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1500;display:none}
.overlay.active{display:block}
.breadcrumb{display:flex;align-items:center;gap:8px;padding:18px;font-size:16px}
.hero{padding:10px 18px 20px}
.hero h1{font-size:26px;font-weight:700}
.properties{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:20px;max-width:1200px;margin:auto}
</style>
</head>
<body>
<nav class="navbar">
  <div class="logo">
    <img src="logo.png" alt="RentEasy">
    <span>RentEasy <span style="color:#16a34a;">Kenya</span></span>
  </div>
  <div class="hamburger" onclick="openMenu()">
    <span></span><span></span><span></span>
  </div>
</nav>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="side-menu" id="sideMenu">
  <div class="close" onclick="closeMenu()">&times;</div>
  <a href="index.html">🏠 Home</a>
  <a href="index.html">🏢 Apartments for Rent</a>
  <a href="index.html">🏘️ Houses for Rent</a>
  <a href="index.html">🛏️ Bedsitters & Studios</a>
  <a href="landlord-login.html">➕ List Your Property</a>
  <a href="about.html">ℹ️ About Us</a>
  <a href="contact.html">📞 Contact</a>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="login.html">🔑 Login</a>
</div>
<div class="breadcrumb">
  <span>🏠</span> <span>›</span> Rent <span>›</span> Apartments <span>›</span> <b>Nairobi</b>
</div>
<div class="hero">
  <h1>Apartments for rent in Nairobi</h1>
  <p style="color:#555;margin-top:8px;">Browse verified apartments across Kenya.</p>
</div>
<div id="dynamicProperties" class="properties"><p>Loading properties...</p></div>
<script>
function openMenu(){document.getElementById('sideMenu').classList.add('active');document.getElementById('overlay').classList.add('active')}
function closeMenu(){document.getElementById('sideMenu').classList.remove('active');document.getElementById('overlay').classList.remove('active')}
</script>
<script type="module" src="script.js"></script>
</body>
</html>
