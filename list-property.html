<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Property | RentEasy Kenya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">🏠 RentEasy Kenya</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#properties">Properties</a></li>
        <li><a href="list-property.html">List Property</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<section style="max-width:700px; margin:40px auto; padding:20px;">

    <h2>List Your Property</h2>

    <p>Fill the form below to add a new rental property.</p>

    <form id="propertyForm" style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">

        <input
            type="text"
            id="title"
            placeholder="Property Title"
            required>

        <input
            type="text"
            id="location"
            placeholder="Location"
            required>

        <input
            type="number"
            id="bedrooms"
            placeholder="Bedrooms"
            min="1"
            required>

        <input
            type="number"
            id="price"
            placeholder="Monthly Rent"
            min="100"
            required>

        <select id="type" required>
            <option value="">Select Property Type</option>
            <option>Apartment</option>
            <option>Maisonette</option>
            <option>Bedsitter</option>
            <option>Studio</option>
            <option>Office</option>
            <option>Shop</option>
        </select>

        <input
            type="tel"
            id="phone"
            placeholder="Contact Phone"
            required>

        <input
            type="text"
            id="amenities"
            placeholder="Amenities">

        <label>
            <input type="checkbox" id="featured">
            ⭐ Feature this property
        </label>

        <textarea
            id="description"
            rows="4"
            placeholder="Property Description"
            required></textarea>

        <input
            type="text"
            id="image"
            placeholder="Image URLs separated by commas">

        <button type="submit" class="btn">
            List Property
        </button>

        <div id="formMessage"></div>

    </form>

</section>

<footer>
    <p>&copy; 2026 RentEasy Kenya. All Rights Reserved.</p>
</footer>

<script type="module">import { app, db } from "./firebase.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const auth = getAuth(app);

const form = document.getElementById("propertyForm");
const messageDiv = document.getElementById("formMessage");

let currentUser = null;

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;

});

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    if (!currentUser) {
        messageDiv.innerHTML = "<p style='color:red;'>Please wait...</p>";
        return;
    }

    const title = document.getElementById("title").value.trim();
    const location = document.getElementById("location").value.trim();
    const bedrooms = parseInt(document.getElementById("bedrooms").value);
    const price = parseInt(document.getElementById("price").value);

    const type = document.getElementById("type").value;
    const phone = document.getElementById("phone").value.trim();
    const amenities = document.getElementById("amenities").value.trim();
    const featured = document.getElementById("featured").checked;
    const description = document.getElementById("description").value.trim();

    const imageInput = document.getElementById("image").value.trim();

    const images = imageInput
        ? imageInput.split(",").map(url => url.trim()).filter(url => url)
        : ["https://picsum.photos/800/500"];

    try {

        await addDoc(collection(db, "properties"), {

            ownerId: currentUser.uid,
            ownerEmail: currentUser.email,

            title,
            location,

            rooms: bedrooms,
            bedrooms,

            price,
            rent: price,

            type,
            phone,
            amenities,
            featured,

            description,

            image: images[0],
            imageUrl: images[0],
            images,

            createdAt: serverTimestamp()

        });

        messageDiv.innerHTML =
            "<p style='color:green;'>✅ Property listed successfully!</p>";

        form.reset();

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1500);

    } catch (error) {

        console.error(error);

        messageDiv.innerHTML =
            `<p style="color:red;">${error.message}</p>`;

    }

});
</script>

</body>
</html>
