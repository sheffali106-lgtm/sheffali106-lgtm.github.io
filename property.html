<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Details - RentEasy Kenya</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
<h2>🏠 RentEasy Kenya</h2>
</nav>

<section class="property-details">

<img src="https://picsum.photos/800/500?random=10" alt="Property">

<div id="propertyDetails">
    <h1 id="title"></h1>

    <p id="location"></p>

    <h2 id="price"></h2>

    <p id="description"></p>
</div>

<h3>Amenities</h3>

<ul>
<li>✅ Parking</li>
<li>✅ CCTV Security</li>
<li>✅ Backup Generator</li>
<li>✅ Borehole Water</li>
<li>✅ Fibre Internet</li>
</ul>
<h3>Book a Viewing</h3>

<p>Interested in this property? Book a viewing today.</p>

<button class="viewing-btn">Book a Viewing</button>
<button onclick="window.open('https://wa.me/254799520544')">
Contact on WhatsApp
</button>

</section>
<script>
const property = JSON.parse(localStorage.getItem("selectedProperty"));

if (property) {
    document.getElementById("title").innerText = property.title;
    document.getElementById("location").innerText = property.location;
    document.getElementById("price").innerText = property.price;
    document.getElementById("description").innerText = property.description;
}

document.querySelector(".viewing-btn").onclick = () => {
    alert("Viewing request received! We will contact you shortly.");
};
</script>
    
</body>
</html>
