<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentEasy Kenya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar"><div class="logo" style="display:flex; align-items:center; gap:8px;">
  <img src="logo.png" alt="RentEasy" style="height:32px;"> RentEasy Kenya
</div>
<ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="landlord-login.html">List Property</a></li></ul></nav>
<header class="hero"><h1>Find Your Dream Home in Kenya</h1><p>Browse verified apartments, bedsitters, studios across Kenya.</p></header>
<section class="featured" id="properties"><h2>Featured Properties</h2><div id="dynamicProperties" class="properties"></div></section>
<section class="cta"><h2>Are You a Landlord?</h2><a href="landlord-login.html" class="btn">List Your Property</a>
<div id="logoutSection" style="display:none; margin-top:20px;"><p id="userEmail"></p><a href="logout.html" class="btn" style="background:#28a745;">Logout</a></div></section>
<footer><p>&copy; 2026 RentEasy Kenya</p></footer>
<script type="module" src="script.js"></script>
<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
onAuthStateChanged(auth, (user)=>{
  if(user){ document.getElementById('logoutSection').style.display="block"; document.getElementById('userEmail').textContent="Logged in as: "+user.email; }
});
</script>
</body>
</html>
