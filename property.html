<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Details - RentEasy</title>
<link rel="stylesheet" href="style.css">
<style>
.review-box { background:#fff; padding:15px; border-radius:10px; margin-top:15px; }
.stars { color:gold; font-size:20px; }
.review-item { border-bottom:1px solid #eee; padding:10px 0; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="logo">🏠 RentEasy Kenya</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="saved.html">❤️ Saved</a></li>
  </ul>
</nav>

<div style="max-width:800px; margin:20px auto; padding:15px;">
  <div id="propertyDetails">Loading property...</div>
  
  <!-- REVIEWS SECTION -->
  <div class="review-box">
    <h2>⭐ Reviews & Ratings</h2>
    <p id="avgRating">Loading ratings...</p>
    <div id="reviewsList"></div>
    
    <h3 style="margin-top:20px;">Leave a Review</h3>
    <select id="ratingInput" style="padding:8px; width:100%; margin:5px 0;">
      <option value="5">⭐⭐⭐⭐⭐ 5 - Excellent</option>
      <option value="4">⭐⭐⭐⭐ 4 - Very Good</option>
      <option value="3">⭐⭐⭐ 3 - Good</option>
      <option value="2">⭐⭐ 2 - Poor</option>
      <option value="1">⭐ 1 - Very Poor</option>
    </select>
    <textarea id="commentInput" placeholder="Write your review..." style="width:100%; height:80px; padding:10px; margin:5px 0;"></textarea>
    <button onclick="submitReview()" class="btn" style="width:100%;">Submit Review</button>
  </div>
</div>

<script type="module">
import { db, auth } from "./firebase.js";
import { doc, getDoc, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const params = new URLSearchParams(window.location.search);
const propertyId = params.get("id");
const detailsDiv = document.getElementById("propertyDetails");
const reviewsList = document.getElementById("reviewsList");
const avgRatingP = document.getElementById("avgRating");
let currentUser = null;

onAuthStateChanged(auth, (user) => { currentUser = user; });

async function loadProperty() {
  if (!propertyId) { detailsDiv.innerHTML = "No property ID"; return; }
  const snap = await getDoc(doc(db, "properties", propertyId));
  if (!snap.exists()) { detailsDiv.innerHTML = "Property not found"; return; }
  const p = snap.data();
  detailsDiv.innerHTML = `
    <img src="${p.imageUrl}" style="width:100%; height:300px; object-fit:cover; border-radius:15px;">
    <h1>${p.title}</h1>
    <p>📍 ${p.location}</p>
    <p><strong style="font-size:22px;">Ksh ${p.price}/month</strong></p>
    <p>${p.description || ''}</p>
    <p>Type: ${p.type || ''} | Beds: ${p.bedrooms || ''}</p>
    <a href="tel:${p.phone || ''}" class="btn" style="background:green; display:block; text-align:center; margin-top:10px;">📞 Call Landlord</a>
    <a href="checkout.html?id=${propertyId}" class="btn" style="background:#00a651; display:block; text-align:center; margin-top:10px; color:white; text-decoration:none; padding:12px; border-radius:8px;">💳 Lipa na M-Pesa - Book Now</a>
  `;
}

async function loadReviews() {
  const q = query(collection(db, "reviews"), where("propertyId", "==", propertyId));
  const snap = await getDocs(q);
  if (snap.empty) {
    avgRatingP.innerHTML = "No reviews yet. Be first!";
    reviewsList.innerHTML = "";
    return;
  }
  let total = 0;
  let html = "";
  snap.forEach(d => {
    const r = d.data();
    total += Number(r.rating);
    html += `<div class="review-item"><strong>${r.userName || 'Anonymous'}</strong> - <span class="stars">${'⭐'.repeat(r.rating)}</span><p>${r.comment}</p><small>${new Date(r.createdAt?.toDate()).toLocaleDateString()}</small></div>`;
  });
  const avg = (total / snap.size).toFixed(1);
  avgRatingP.innerHTML = `Average: ${'⭐'.repeat(Math.round(avg))} ${avg} (${snap.size} reviews)`;
  reviewsList.innerHTML = html;
}

window.submitReview = async () => {
  if (!currentUser) { alert("Please login to review"); window.location.href="landlord-login.html"; return; }
  const rating = document.getElementById("ratingInput").value;
  const comment = document.getElementById("commentInput").value.trim();
  if (!comment) { alert("Write a comment"); return; }

  await addDoc(collection(db, "reviews"), {
    propertyId: propertyId,
    userId: currentUser.uid,
    userName: currentUser.email,
    rating: Number(rating),
    comment: comment,
    createdAt: new Date()
  });
  alert("Review submitted ⭐");
  document.getElementById("commentInput").value = "";
  loadReviews();
};

loadProperty();
loadReviews();
</script>
</body>
</html>
