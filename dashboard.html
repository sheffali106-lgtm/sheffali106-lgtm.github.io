<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | RentEasy Kenya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">🏠 RentEasy Kenya</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="list-property.html">List Property</a></li>
        <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
</nav>

<section style="max-width:1000px; margin:40px auto; padding:20px;">
    <h2 id="welcomeText">Loading your listings...</h2>
    <p id="countText"></p>
    
    <div id="dashboardList" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px; margin-top:30px;">
        <!-- Properties load here -->
    </div>
</section>

<script type="module">
import { db, auth } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { collection, query, where, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const list = document.getElementById('dashboardList');
const welcome = document.getElementById('welcomeText');
const countText = document.getElementById('countText');

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "landlord-login.html";
        return;
    }

    welcome.textContent = `Welcome, ${user.email}`;
    
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault(); await signOut(auth); window.location.href = "index.html";
    });

    // Load only MY properties
    const q = query(collection(db, "properties"), where("landlordId", "==", user.uid));
    const snap = await getDocs(q);

    if (snap.empty) {
        list.innerHTML = `<p>You have no listings yet. <a href="list-property.html">List one now</a></p>`;
        countText.textContent = "0 properties";
        return;
    }

    countText.textContent = `${snap.size} properties listed`;
    let html = "";
    snap.forEach((docSnap) => {
        const p = docSnap.data();
        const price = (p.price || p.rent || 0).toLocaleString();
        const image = p.image || p.imageUrl || "https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=800";
        html += `
        <div style="border:1px solid #ddd; border-radius:10px; overflow:hidden;">
            <img src="${image}" style="width:100%; height:180px; object-fit:cover;">
            <div style="padding:15px;">
                <h3>${p.title}</h3>
                <p>📍 ${p.location}</p>
                <p><strong>KSh ${price}</strong></p>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <a href="property.html?id=${docSnap.id}" style="background:#0d6efd; color:white; padding:8px 12px; border-radius:5px; text-decoration:none;">View</a>
                    <button onclick="deleteProperty('${docSnap.id}')" style="background:#dc3545; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer;">Delete</button>
                </div>
            </div>
        `;
    });
    list.innerHTML = html;
});

// Make delete function global
window.deleteProperty = async (id) => {
    if (!confirm("Delete this property? This cannot be undone.")) return;
    try {
        await deleteDoc(doc(db, "properties", id));
        alert("Deleted!");
        window.location.reload();
    } catch (err) {
        alert("Error: " + err.message);
    }
}
</script>

</body>
</html>
