<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEasy Kenya</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>🏠 RentEasy Kenya</h2>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#properties">Properties</a></li>
        <li><a href="list-property.html">List Property</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
</nav>

<header class="hero">
    <h1>Find Your Dream Home in Kenya</h1>
    <p>Browse verified rental properties in Nairobi and beyond.</p>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search Kileleshwa, Runda, Westlands..."
        >

        <button onclick="searchProperties()">Search</button>
    </div>
</header>

<section class="properties" id="properties">

    <div class="card">

        <span class="badge">Featured</span>

        <img src="https://picsum.photos/400/250?random=1" alt="2 Bedroom Apartment">

        <div class="card-content">

            <h3>2 Bedroom Apartment</h3>

            <p>📍 Kileleshwa</p>

            <p>🛏️ 2 Bedrooms</p>

            <p>🚿 2 Bathrooms</p>

            <p>🚗 Parking Available</p>

            <p class="price">KSh 65,000/month</p>

            <button onclick="window.open('https://wa.me/254799520544','_blank')">
                Contact on WhatsApp
            </button>

            <button class="details-btn">
                View Details
            </button>

        </div>

    </div>
