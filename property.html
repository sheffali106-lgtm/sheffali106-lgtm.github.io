<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details | RentEasy Kenya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">🏠 RentEasy Kenya</div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="list-property.html">List Property</a></li>
    </ul>
</nav>

<section id="propertyDetails" style="max-width:900px; margin:40px auto; padding:20px;">
    <p>Loading property...</p>
</section>

<script type="module">
import { db } from "./firebase.js";
import {
    doc,
    getDoc,
    collection,
    getDocs,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const container = document.getElementById("propertyDetails");

if (!id) {
    container.innerHTML = "<p>No property ID found. Go back to <a href='index.html'>Home</a> and click View Details.</p>";
} else {
    try {
        const snap = await getDoc(doc(db, "properties", id));

        if (!snap.exists()) {
            container.innerHTML = "<p>Property not found.</p>";
        } else {

            const p = snap.data();

            const location = p.location || p.area || p.town || "Location unavailable";
            const rooms = p.rooms || p.bedrooms || p.beds || "N/A";
            const price = p.price || p.rent || "Price not available";
            const title = p.title || "Rental Property";
            const description = p.description || p.desc || "No description available.";

            const type = p.type || "Not specified";
            const phone = p.phone || "";
            const amenities = p.amenities || "Not specified";

            // Support both old and new listings
            const images = Array.isArray(p.images) && p.images.length > 0
                ? p.images
                : [p.image || p.imageUrl || p.photo || "https://picsum.photos/800/500"];

            let currentImage = 0;

            let whatsappNumber = "";
            if (phone) {
                whatsappNumber = phone.startsWith("0")
                    ? "254" + phone.substring(1)
                    : phone;
            }

            container.innerHTML = `
                <img id="galleryImage"
                     src="${images[0]}"
                     style="width:100%;border-radius:10px;max-height:500px;object-fit:cover;">

                <div style="display:flex;justify-content:space-between;margin-top:15px;">
                    <button id="prevImage">◀ Previous</button>
                    <button id="nextImage">Next ▶</button>
                </div>

                <h2 style="margin-top:20px;">${title}</h2>

                <p>🏢 <strong>Property Type:</strong> ${type}</p>

                <p>📍 <strong>Location:</strong> ${location}</p>

                <p>🛏️ <strong>Bedrooms:</strong> ${rooms}</p>

                <p>💰 <strong>Rent:</strong> KSh ${price}/month</p>

                <p>📞 <strong>Contact:</strong> ${phone || "Not provided"}</p>

                <p>✅ <strong>Amenities:</strong> ${amenities}</p>

                <p style="margin-top:20px;">
                    <strong>Description</strong><br>
                    ${description}
                </p>

                <div style="display:flex;gap:15px;flex-wrap:wrap;margin-top:30px;">                    ${
                        phone
                        ? `<a href="tel:${phone}"
                             style="background:#0d6efd; color:white; padding:12px 20px; border-radius:6px; text-decoration:none;">
                             📞 Call Landlord
                           </a>`
                        : ""
                    }

                    ${
                        whatsappNumber
                        ? `<a href="https://wa.me/${whatsappNumber}"
                             target="_blank"
                             style="background:#25D366; color:white; padding:12px 20px; border-radius:6px; text-decoration:none;">
                             💬 WhatsApp
                           </a>`
                        : ""
                    }

                    <a href="https://www.google.com/maps/search/${encodeURIComponent(location)}"
                       target="_blank"
                       style="background:#EA4335; color:white; padding:12px 20px; border-radius:6px; text-decoration:none;">
                        📍 View on Google Maps
                    </a>

                </div>

                <br><br>
<hr style="margin:40px 0;">

<h2>📅 Book a Viewing</h2>

<form id="bookingForm" style="display:flex;flex-direction:column;gap:15px;max-width:500px;">

    <input
        type="text"
        id="viewerName"
        placeholder="Your Full Name"
        required>

    <input
        type="tel"
        id="viewerPhone"
        placeholder="Your Phone Number"
        required>

    <input
        type="date"
        id="viewingDate"
        required>

    <input
        type="time"
        id="viewingTime"
        required>

    <textarea
        id="viewerMessage"
        rows="4"
        placeholder="Optional message to the landlord"></textarea>

    <button
        type="submit"
        style="background:#25D366;color:white;border:none;padding:12px;border-radius:6px;cursor:pointer;">
        Book Viewing
    </button>

</form>

<div id="bookingMessage" style="margin-top:15px;"></div>

                <a href="index.html" style="color:#25D366;">← Back to listings</a>

<hr style="margin:40px 0;">

<h2>🏠 Similar Properties</h2>

<div id="similarProperties">
    <p>Loading similar properties...</p>
</div>
            `;

            // ===============================
            // IMAGE GALLERY
            // ===============================
            const galleryImage = document.getElementById("galleryImage");
            const prevImage = document.getElementById("prevImage");
            const nextImage = document.getElementById("nextImage");

            if (images.length <= 1) {
                prevImage.style.display = "none";
                nextImage.style.display = "none";
            } else {

                prevImage.addEventListener("click", () => {
                    currentImage =
                        (currentImage - 1 + images.length) % images.length;

                    galleryImage.src = images[currentImage];
                });

                nextImage.addEventListener("click", () => {
                    currentImage =
                        (currentImage + 1) % images.length;

                    galleryImage.src = images[currentImage];
                });

            }

                    // ===============================
            // LOAD SIMILAR PROPERTIES
            // ===============================
            const similarContainer = document.getElementById("similarProperties");

            if (similarContainer) {

                const snapshot = await getDocs(collection(db, "properties"));

                let html = "";
                let count = 0;

                snapshot.forEach((docSnap) => {

                    if (docSnap.id === id) return;

                    const item = docSnap.data();

                    const sameLocation =
                        (item.location || "").toLowerCase() === location.toLowerCase();

                    const sameType =
                        (item.type || "").toLowerCase() === type.toLowerCase();

                    if ((sameLocation || sameType) && count < 3) {

                        const image =
                            item.image ||
                            item.imageUrl ||
                            "https://picsum.photos/400/250";

                        html += `
                            <div style="border:1px solid #ddd;padding:15px;margin-bottom:15px;border-radius:10px;">
                                <img src="${image}"
                                     style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;">

                                <h3>${item.title}</h3>

                                <p>📍 ${item.location}</p>

                                <p><strong>KSh ${item.price}/month</strong></p>

                                <a href="property.html?id=${docSnap.id}"
                                   style="display:inline-block;margin-top:10px;background:#25D366;color:white;padding:10px 18px;border-radius:6px;text-decoration:none;">
                                   View Details
                                </a>
                            </div>
                        `;

                        count++;
                    }

                });

                if (count === 0) {
                    html = "<p>No similar properties found.</p>";
                }

                                similarContainer.innerHTML = html;
            }

        }

    } catch (err) {
        console.error(err);
        container.innerHTML = `<p>Error loading: ${err.message}</p>`;
    }
}
</script>

</body>
</html>
