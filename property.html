<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details | RentEasy Kenya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">🏠 RentEasy Kenya</div>

    <ul class="nav-links">
        <li><a href="index.html">← Back to Home</a></li>
    </ul>
</nav>

<section class="property-details">

    <div class="gallery">

        <img
            id="propertyImage"
            src="https://picsum.photos/800/500"
            alt="Property Image">

    </div>

    <div class="card-content">

        <h1 id="propertyTitle">Loading...</h1>

        <p id="propertyLocation"></p>

        <h2 id="propertyPrice"></h2>

        <p id="propertyDescription"></p>

        <h3>Location</h3>

        <iframe
            id="propertyMap"
            width="100%"
            height="350"
            style="border:0;border-radius:10px;"
            loading="lazy"
            allowfullscreen>
        </iframe>

        <br><br>

        <button id="directionsBtn" class="details-btn">
            📍 Get Directions
        </button>

        <button id="whatsappBtn" class="whatsapp-btn">
            Contact on WhatsApp
        </button>

        <button id="viewingBtn" class="details-btn">
            Book Viewing
        </button>

        <h3>Nearby Places</h3>

        <div class="features">

            <div class="feature">
                <h4>🏫 Schools</h4>
                <p>Schools near this property.</p>
            </div>

            <div class="feature">
                <h4>🏥 Hospitals</h4>
                <p>Hospitals nearby.</p>
            </div>

            <div class="feature">
                <h4>🛒 Supermarkets</h4>
                <p>Supermarkets nearby.</p>
            </div>

            <div class="feature">
                <h4>🛍️ Shopping Malls</h4>
                <p>Shopping malls nearby.</p>
            </div>

        </div>

    </div>

</section>

<script>

const property = JSON.parse(localStorage.getItem("selectedProperty"));

if (!property) {

    alert("No property selected.");

    window.location.href = "index.html";

} else {

    document.getElementById("propertyTitle").innerText =
        property.title || "No Title";

    document.getElementById("propertyLocation").innerText =
        "📍 " + (property.location || "Unknown Location");

    document.getElementById("propertyPrice").innerText =
        "KSh " + (property.price || "0") + "/month";

    document.getElementById("propertyDescription").innerText =
        property.description || "No description available.";

    document.getElementById("propertyImage").src =
        property.image || "https://picsum.photos/800/500";

    document.getElementById("propertyMap").src =
        "https://www.google.com/maps?q=" +
        encodeURIComponent(property.location) +
        "&output=embed";

    document.getElementById("directionsBtn").onclick = function () {

        window.open(
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(property.location),
            "_blank"
        );

    };

}

document.getElementById("whatsappBtn").onclick = function () {

    window.open("https://wa.me/254799520544", "_blank");

};

document.getElementById("viewingBtn").onclick = function () {

    alert("Viewing request received! We will contact you shortly.");

};

</script>

</body>
</html>
