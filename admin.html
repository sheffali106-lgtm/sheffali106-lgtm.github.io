<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - RentEasy Kenya</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
<h2>🏠 RentEasy Kenya Admin</h2>
</nav>

<section class="form-container">

<h1>Add New Property</h1>

<form id="propertyForm">

<input type="text" id="title" placeholder="Property Title">

<input type="text" id="location" placeholder="Location">

<input type="number" id="price" placeholder="Monthly Rent (KSh)">

<input type="text" id="rooms" placeholder="Bedrooms">

<textarea id="description" placeholder="Description"></textarea>

<button type="submit">Add Property</button>

</form>

</section>

<script src="admin.js"></script>

</body>
</html>
